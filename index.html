<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喜多ハウジング | 業務ポータル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232C2420'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='%23C4956A' font-family='sans-serif' font-weight='bold'>K</text></svg>">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: #F5F3F0; color: #2C2420; min-height: 100vh; }

header {
  background: #2C2420;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo { font-size: 13px; letter-spacing: 3px; color: #C4956A; }
.sep { color: rgba(255,255,255,0.2); }
.htitle { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7); }

main { padding: 32px 24px; max-width: 800px; margin: 0 auto; }

h2 { font-size: 11px; letter-spacing: 3px; color: #A09890; font-weight: 400; margin-bottom: 12px; margin-top: 32px; }
h2:first-child { margin-top: 0; }

.tools { display: flex; flex-direction: column; gap: 8px; }

.tool {
  background: #fff;
  border: 1px solid #E5E0DA;
  border-radius: 10px;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.tool:hover { border-color: #C4956A; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

.tool-icon {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 20px;
}

.tool-info { flex: 1; min-width: 0; }
.tool-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.tool-desc { font-size: 12px; color: #8B8580; line-height: 1.6; }
.tool-arrow { color: #C5BFB8; font-size: 18px; flex-shrink: 0; }

footer {
  text-align: center;
  padding: 40px 24px;
  font-size: 11px;
  color: #C5BFB8;
  letter-spacing: 2px;
}
</style>
</head>
<body>

<header>
  <span class="logo">KITA HOUSING</span>
  <span class="sep">|</span>
  <span class="htitle">業務ポータル</span>
</header>

<main>

  <h2>提案書ツール</h2>
  <div class="tools">

    <a href="./proposal/index.html" class="tool">
      <div class="tool-icon" style="background:#F5EDE5;">📋</div>
      <div class="tool-info">
        <div class="tool-name">リフォームプラン提案書</div>
        <div class="tool-desc">複数プランの比較・間取り図・A3 PDF出力 / お客様共有URL発行</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>

    <a href="./contract/index.html" class="tool">
      <div class="tool-icon" style="background:#EDF3EE;">📄</div>
      <div class="tool-info">
        <div class="tool-name">ご契約提案書</div>
        <div class="tool-desc">外観・内装・B/A・資金計画・仕様を一括管理 / お客様共有URL発行</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>

  </div>

  <h2>3D・ビューア</h2>
  <div class="tools">

    <a href="./walkthrough/index.html" class="tool">
      <div class="tool-icon" style="background:#E6E8F1;">🏠</div>
      <div class="tool-info">
        <div class="tool-name">3D ウォークスルー</div>
        <div class="tool-desc">GLBファイルをアップロードしてリアルタイム3Dビューア表示</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>

  </div>

</main>

<footer>喜多ハウジング株式会社 技術支援部</footer>

</body>
</html>
