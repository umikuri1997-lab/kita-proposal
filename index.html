<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>喜多ハウジング 提案書</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%;width:100%;overflow:hidden}
  body{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;-webkit-font-smoothing:antialiased;background:#FAF8F5}
  ::-webkit-scrollbar{display:none}
  input,textarea,button{font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:#C4956A !important}
</style>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useCallback}=React;

/* ★★★ ここを書き換える ★★★ */
const WORKER_URL="https://kita-proposal-api.kitahousing.workers.dev";

/* ━━━ API（スタッフ操作はAPIキー付き） ━━━ */
const AK="kita_api_key";
function getKey(){return localStorage.getItem(AK)||"";}
function setKey(k){localStorage.setItem(AK,k);}

async function api(path,{method="GET",body,auth=false}={}){
  const h={"Content-Type":"application/json"};
  if(auth)h["X-API-Key"]=getKey();
  const opt={method,headers:h};
  if(body)opt.body=JSON.stringify(body);
  const res=await fetch(`${WORKER_URL}${path}`,opt);
  if(res.status===401)throw new Error("認証エラー：APIキーが正しくありません");
  if(!res.ok){const t=await res.text();throw new Error(`${res.status}: ${t}`);}
  if(method==="DELETE")return null;
  return res.json();
}
const saveP=(id,data)=>api(`/api/proposals/${id}`,{method:"POST",body:{data},auth:true});
const loadP=(id)=>api(`/api/proposals/${id}`); // 認証不要
const listP=()=>api("/api/proposals",{auth:true});
const delP=(id)=>api(`/api/proposals/${id}`,{method:"DELETE",auth:true});

/* ━━━ Data ━━━ */
const mkFloor=(l)=>({label:l,image:null,rooms:[{name:"",size:""}]});
const mkView=(l,t)=>({label:l,image:null,tag:t||""});
const mkExt=(l)=>({label:l,image:null});
const DEFAULT={customerName:"",staffName:"",planTitle:"新築住宅プラン",coverImage:null,concept:{headline:"家族が、\nつながる暮らし。",body:"リビングを中心に、家族の気配が自然と感じられる間取り設計。開放的な吹き抜けと大きな窓から光が差し込み、四季の移ろいを楽しめる住まいをご提案いたします。",tags:["開放感","採光","回遊動線","省エネ"]},plan:{type:"4LDK ＋ WIC ＋ SIC",area:"112.62",tsubo:"34.06",floors:[{label:"1F",image:null,rooms:[{name:"LDK",size:"18.5"},{name:"和室",size:"4.5"},{name:"玄関",size:"3.0"}]},{label:"2F",image:null,rooms:[{name:"主寝室",size:"8.0"},{name:"子ども部屋①",size:"6.0"},{name:"子ども部屋②",size:"6.0"}]}]},exterior:{description:"シンプルモダンの外観に、木目調アクセントで温かみをプラス。",views:[{label:"正面",image:null},{label:"南東",image:null},{label:"夜景",image:null}]},interior:{description:"無垢材のフローリングとホワイトの壁を基調に、上質で落ち着いた空間を演出。",views:[{label:"LDK 全景",image:null,tag:"1F"},{label:"キッチン",image:null,tag:"1F"},{label:"主寝室",image:null,tag:"2F"},{label:"洗面室",image:null,tag:"1F"}]},viewer3dUrl:"",specs:[{category:"構造",value:"木造軸組工法"},{category:"基礎",value:"ベタ基礎"},{category:"断熱",value:"吹付け断熱"},{category:"窓",value:"Low-E複層ガラス"},{category:"換気",value:"第1種換気（熱交換型）"},{category:"耐震",value:"耐震等級3"}],pricing:{items:[{label:"建物本体",amount:""},{label:"付帯工事",amount:""},{label:"外構工事",amount:""},{label:"諸費用",amount:""}],total:"",notes:"上記は概算見積もりです。土地代は含まれておりません。"},contact:{phone:"076-000-0000",hours:"受付時間 9:00 - 18:00（水曜定休）",address:"石川県○○市○○町0-0-0"}};
const RC=["#C4956A","#7A9B6D","#6D7F9B","#9B6D8A","#9B8A6D","#6D9B93","#8A6D9B","#9B7A6D","#6D8A7A","#9B6D6D","#7A6D9B","#6D9B8A","#9B916D","#6D819B","#9B6D7A","#7A9B86","#916D9B","#9B866D","#6D9B7A","#8A9B6D"];
const GR=["#A0896D,#C4B5A0","#6B8F71,#8BA893","#7E8B9A,#9AABB8","#9A8B7E,#B8A99A","#8B7A9B,#A899B8"];
const genId=()=>{const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let r="";for(let i=0;i<6;i++)r+=c[Math.floor(Math.random()*c.length)];return r;};

/* ━━━ App ━━━ */
function App(){
  const[mode,setMode]=useState("loading");
  const[data,setData]=useState(DEFAULT);
  const[tab,setTab]=useState("basic");
  const[lb,setLb]=useState(null);
  const[shareId,setShareId]=useState(null);
  const[err,setErr]=useState(null);

  useEffect(()=>{
    const hash=location.hash.replace("#","");
    const params=new URLSearchParams(location.search);
    // お客様ビュー: ?v=1#CODE
    if(hash&&hash.length>=4&&params.get("v")==="1"){
      loadP(hash).then(row=>{
        if(row?.data){setData(row.data);setMode("customer");}
        else setMode("login");
      }).catch(()=>setMode("login"));
      return;
    }
    // スタッフ: APIキーがあるか
    if(getKey()){
      if(hash&&hash.length>=4){
        loadP(hash).then(row=>{
          if(row?.data){setData(row.data);setShareId(hash);}
          setMode("edit");
        }).catch(()=>setMode("edit"));
      } else setMode("edit");
    } else setMode("login");
  },[]);

  const handleLogin=async(key)=>{
    setKey(key);
    try{await listP();setMode("edit");}
    catch(e){setKey("");throw e;}
  };

  const handleSave=async()=>{
    const id=shareId||genId();
    try{await saveP(id,data);setShareId(id);return id;}
    catch(e){setErr(e.message);return null;}
  };

  const handleLoad=async(id)=>{
    try{const row=await loadP(id);if(row?.data){setData(row.data);setShareId(id);setMode("edit");}}
    catch(e){setErr(e.message);}
  };

  if(mode==="loading")return<Sh full><div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}><p style={{color:"#A09890",fontSize:13,letterSpacing:2}}>読み込み中...</p></div></Sh>;
  if(mode==="login")return<Login onDone={handleLogin}/>;
  if(mode==="walkthrough")return<WT url={data.viewer3dUrl} onClose={()=>setMode("preview")}/>;
  return<>
    {mode==="customer"&&<Sh full><CV data={data} onWt={()=>setMode("walkthrough")} onZoom={setLb}/></Sh>}
    {mode==="preview"&&<Sh full><PV data={data} onBack={()=>setMode("edit")} onWt={()=>setMode("walkthrough")} onZoom={setLb}/></Sh>}
    {mode==="edit"&&<Sh><Ed data={data} setData={setData} tab={tab} setTab={setTab} onPv={()=>setMode("preview")} sid={shareId} onSave={handleSave} onLoad={handleLoad} onNew={()=>{setData(DEFAULT);setShareId(null);setTab("basic");}} onList={()=>setMode("list")} err={err} setErr={setErr} onLogout={()=>{setKey("");setMode("login");}}/></Sh>}
    {mode==="list"&&<Sh><LS onLoad={handleLoad} onBack={()=>setMode("edit")}/></Sh>}
    {lb&&mode!=="walkthrough"&&<LightBox {...lb} onClose={()=>setLb(null)} onChange={setLb}/>}
  </>;
}

/* ━━━ Login（APIキー入力、初回のみ） ━━━ */
function Login({onDone}){
  const[key,setKeyV]=useState("");const[testing,setTesting]=useState(false);const[err,setErr]=useState(null);
  const go=async()=>{
    setTesting(true);setErr(null);
    try{await onDone(key);}catch(e){setErr(e.message);}
    setTesting(false);
  };
  return<Sh><div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
    <div style={{width:"100%",maxWidth:360}}>
      <div style={{textAlign:"center",marginBottom:40}}>
        <div style={{fontSize:10,letterSpacing:5,color:"#A09890",marginBottom:8}}>KITA HOUSING</div>
        <div style={{fontSize:20,fontWeight:300,color:"#2C2420",letterSpacing:2}}>提案書ツール</div>
        <div style={{width:30,height:1,background:"#C4956A",margin:"16px auto"}}/>
      </div>
      <div style={{background:"#fff",borderRadius:12,padding:24}}>
        <div style={{fontSize:14,fontWeight:600,color:"#2C2420",marginBottom:16}}>スタッフログイン</div>
        <Fi l="APIキー" v={key} s={setKeyV} p="キーを入力" type="password"/>
        {err&&<div style={{padding:12,background:"#FFF0F0",borderRadius:8,fontSize:11,color:"#C44",marginBottom:12}}>{err}</div>}
        <button onClick={go} disabled={!key||testing} style={{width:"100%",padding:"14px 0",background:key?"#2C2420":"#E5E0DA",color:key?"#fff":"#A09890",border:"none",borderRadius:8,fontSize:13,fontWeight:500,cursor:key?"pointer":"default",letterSpacing:1}}>{testing?"確認中...":"ログイン"}</button>
      </div>
    </div>
  </div></Sh>;
}

/* ━━━ List ━━━ */
function LS({onLoad,onBack}){
  const[list,setList]=useState([]);const[ld,setLd]=useState(true);
  useEffect(()=>{listP().then(r=>{setList(r||[]);setLd(false);}).catch(()=>setLd(false));},[]);
  return<>
    <div style={S.eH}><button onClick={onBack} style={{background:"none",border:"none",color:"#2C2420",fontSize:13,cursor:"pointer"}}>◀ 戻る</button><div style={{fontSize:14,fontWeight:600,color:"#2C2420"}}>保存済み提案書</div><div style={{width:48}}/></div>
    <div style={S.eB}>{ld&&<div style={{textAlign:"center",padding:60,color:"#A09890"}}>読み込み中...</div>}{!ld&&list.length===0&&<div style={{textAlign:"center",padding:60,color:"#A09890"}}>提案書はありません</div>}{list.map(it=><div key={it.id} style={{padding:16,background:"#fff",borderRadius:10,border:"1px solid #EDEAE6",marginBottom:10,display:"flex",alignItems:"center",gap:12}}>
      <div style={{flex:1}}><div style={{fontSize:14,color:"#2C2420",fontWeight:500}}>{it.customerName||"未設定"} 様</div><div style={{fontSize:11,color:"#A09890",marginTop:3}}>{it.planTitle} <span style={{fontFamily:"monospace",fontSize:10}}>#{it.id}</span></div></div>
      <button onClick={()=>onLoad(it.id)} style={{background:"#2C2420",color:"#fff",border:"none",borderRadius:6,padding:"8px 14px",fontSize:11,cursor:"pointer"}}>開く</button>
      <button onClick={async()=>{if(confirm("削除?")){{await delP(it.id).catch(()=>{});setList(l=>l.filter(x=>x.id!==it.id));}}}} style={{background:"none",border:"none",color:"#CCC5BE",fontSize:16,cursor:"pointer"}}>✕</button>
    </div>)}</div>
  </>;
}

/* ━━━ Editor ━━━ */
const TABS=[{id:"basic",l:"基本"},{id:"concept",l:"コンセプト"},{id:"plan",l:"間取り"},{id:"exterior",l:"外観"},{id:"interior",l:"内装"},{id:"3d",l:"3D"},{id:"spec",l:"仕様"},{id:"price",l:"価格"},{id:"contact",l:"連絡先"}];

function Ed({data,setData,tab,setTab,onPv,sid:shareId,onSave,onLoad,onNew,onList,err,setErr,onLogout}){
  const u=(p,v)=>up(setData,p,v);const[saving,setSaving]=useState(false);const[showSh,setShowSh]=useState(false);const[sid,setSid]=useState(shareId);
  useEffect(()=>{setSid(shareId);},[shareId]);
  const doSave=async()=>{setSaving(true);const id=await onSave();if(id){setSid(id);setShowSh(true);}setSaving(false);};
  const shareUrl=sid?`${location.origin}${location.pathname}?v=1#${sid}`:"";
  return<>
    <div style={{...S.eH,flexWrap:"wrap",gap:8}}>
      <div style={{flex:1,minWidth:100}}><div style={{fontSize:10,letterSpacing:3,color:"#A09890",marginBottom:2}}>KITA HOUSING</div><div style={{fontSize:14,fontWeight:600,color:"#2C2420"}}>提案書作成</div></div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}><button onClick={onNew} style={{...S.smB,background:"#F0EDE8",color:"#6B6560"}}>新規</button><button onClick={onList} style={{...S.smB,background:"#F0EDE8",color:"#6B6560"}}>一覧</button><button onClick={doSave} disabled={saving} style={{...S.smB,background:"#C4956A",color:"#fff"}}>{saving?"...":"保存"}</button><button onClick={onPv} style={{...S.smB,background:"#2C2420",color:"#fff"}}>▶</button></div>
    </div>
    {showSh&&sid&&<ShMdl url={shareUrl} id={sid} onClose={()=>setShowSh(false)}/>}
    {err&&<div style={{padding:"10px 16px",background:"#FFF0F0",fontSize:11,color:"#C44",display:"flex",justifyContent:"space-between"}}><span>{err}</span><button onClick={()=>setErr(null)} style={{background:"none",border:"none",color:"#C44",cursor:"pointer"}}>✕</button></div>}
    <div style={S.tB}>{TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tI,color:tab===t.id?"#2C2420":"#A09890",borderBottom:tab===t.id?"2px solid #C4956A":"2px solid transparent",fontWeight:tab===t.id?600:400}}>{t.l}</button>)}</div>
    <div style={S.eB}>
      {tab==="basic"&&<EBas d={data} u={u}/>}{tab==="concept"&&<ECon d={data} u={u}/>}{tab==="plan"&&<EPla d={data} u={u}/>}{tab==="exterior"&&<EExt d={data} u={u}/>}{tab==="interior"&&<EInt d={data} u={u}/>}{tab==="3d"&&<FS t="3Dウォークスルー"><Fi l="URL" v={data.viewer3dUrl} s={v=>u("viewer3dUrl",v)} p="https://..."/></FS>}{tab==="spec"&&<ESpe d={data} u={u}/>}{tab==="price"&&<EPri d={data} u={u}/>}{tab==="contact"&&<ECon2 d={data} u={u}/>}
    </div>
    <div style={{padding:"8px 16px",borderTop:"1px solid #EDEAE6",background:"#fff",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}><button onClick={onLogout} style={{background:"none",border:"none",color:"#A09890",fontSize:10,cursor:"pointer",letterSpacing:1}}>ログアウト</button>{sid&&<span style={{fontSize:10,color:"#A09890",fontFamily:"monospace",letterSpacing:2}}>#{sid}</span>}</div>
  </>;
}

function ShMdl({url,id,onClose}){const[cp,setCp]=useState(false);const copy=async()=>{try{await navigator.clipboard.writeText(url);setCp(true);setTimeout(()=>setCp(false),2000);}catch(e){}};
  return<div style={{position:"absolute",inset:0,zIndex:200,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={onClose}><div style={{background:"#fff",borderRadius:16,padding:24,maxWidth:400,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}} onClick={e=>e.stopPropagation()}>
    <div style={{fontSize:16,fontWeight:600,color:"#2C2420",marginBottom:4}}>保存しました</div><div style={{fontSize:11,color:"#A09890",marginBottom:20,lineHeight:1.8}}>以下のURLをお客様に共有してください。</div>
    <div style={{background:"#F5F3F0",borderRadius:10,padding:14,marginBottom:14,textAlign:"center"}}><div style={{fontSize:10,color:"#A09890",letterSpacing:2,marginBottom:4}}>共有コード</div><div style={{fontSize:28,fontWeight:600,color:"#2C2420",letterSpacing:6,fontFamily:"monospace"}}>{id}</div></div>
    <div style={{background:"#F5F3F0",borderRadius:8,padding:"10px 12px",marginBottom:16,wordBreak:"break-all",fontSize:10,color:"#6B6560",fontFamily:"monospace"}}>{url}</div>
    <div style={{display:"flex",gap:8}}><button onClick={copy} style={{flex:1,padding:"12px 0",background:"#2C2420",color:"#fff",border:"none",borderRadius:8,fontSize:12,fontWeight:500,cursor:"pointer",letterSpacing:1}}>{cp?"✓ コピー済み":"URLをコピー"}</button><button onClick={onClose} style={{padding:"12px 18px",background:"#F0EDE8",color:"#6B6560",border:"none",borderRadius:8,fontSize:12,cursor:"pointer"}}>閉じる</button></div>
  </div></div>;
}

/* ━━━ Views ━━━ */
function CV({data,onWt,onZoom}){const ref=useRef(null);const[sy,setSy]=useState(0);useEffect(()=>{const el=ref.current;if(!el)return;const h=()=>setSy(el.scrollTop);el.addEventListener("scroll",h,{passive:true});return()=>el.removeEventListener("scroll",h);},[]);return<div ref={ref} style={S.sc}><Pres data={data} sy={sy} onWt={onWt} onZoom={onZoom}/></div>;}
function PV({data,onBack,onWt,onZoom}){const ref=useRef(null);const[sy,setSy]=useState(0);useEffect(()=>{const el=ref.current;if(!el)return;const h=()=>setSy(el.scrollTop);el.addEventListener("scroll",h,{passive:true});return()=>el.removeEventListener("scroll",h);},[]);return<><button onClick={onBack} style={S.bk}>◀ 編集</button><div ref={ref} style={S.sc}><Pres data={data} sy={sy} onWt={onWt} onZoom={onZoom}/></div></>;}

/* ━━━ Presentation（レスポンシブ） ━━━ */
function Pres({data,sy,onWt,onZoom}){
  const[af,setAf]=useState(0);const[ei,setEi]=useState(0);const[iFlt,setIFlt]=useState("ALL");const[ii,setIi]=useState(0);
  useEffect(()=>{setIi(0);},[iFlt]);const ev=data.exterior.views.filter(v=>v.label);const iv=data.interior.views.filter(v=>v.label);
  const iTags=["ALL",...new Set(iv.map(v=>v.tag).filter(Boolean))];const iF=iFlt==="ALL"?iv:iv.filter(v=>v.tag===iFlt);
  const tR=data.plan.floors.reduce((a,f)=>a+f.rooms.filter(r=>r.name).length,0);
  const zoom=(src,label,list,index)=>{if(src)onZoom({src,label,list:list||null,index:index||0});};
  const mw={maxWidth:800,margin:"0 auto",width:"100%"};

  return<>
    {/* Cover - full width always */}
    <div style={{height:"100vh",position:"relative",overflow:"hidden",display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
      <div style={{position:"absolute",inset:0,zIndex:1,background:"linear-gradient(180deg, rgba(30,25,22,0.1) 0%, rgba(30,25,22,0.06) 40%, rgba(30,25,22,0.8) 100%)"}}/>
      {data.coverImage?<img src={data.coverImage} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",transform:`translateY(${Math.min(sy*0.25,140)}px) scale(1.06)`}}/>:<div style={{position:"absolute",inset:0,background:"linear-gradient(135deg, #8B7355, #A0896D 30%, #6B8F71 60%, #C4B5A0)",transform:`translateY(${Math.min(sy*0.25,140)}px) scale(1.06)`}}/>}
      <div style={{position:"relative",zIndex:2,padding:"0 5vw 52px",opacity:Math.max(1-sy/400,0),...mw}}>
        {data.staffName&&<div style={{fontSize:11,letterSpacing:4,color:"rgba(255,255,255,0.5)",marginBottom:10}}>担当：{data.staffName}</div>}
        <h1 style={{fontSize:"clamp(26px, 4vw, 42px)",fontWeight:300,color:"#fff",lineHeight:1.6,margin:0,letterSpacing:2}}>{data.customerName?`${data.customerName} 様邸`:"○○様邸"}</h1>
        <div style={{fontSize:"clamp(13px, 2vw, 18px)",fontWeight:300,color:"rgba(255,255,255,0.7)",letterSpacing:3,marginTop:6}}>{data.planTitle}</div>
        <div style={{width:36,height:1,background:"#C4956A",margin:"20px 0"}}/>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",letterSpacing:2}}>喜多ハウジング株式会社</div>
      </div>
    </div>

    {/* Concept */}
    <PSec bg="#FAF8F5"><Lb en="CONCEPT" ja="コンセプト"/>
      <h2 style={{fontSize:"clamp(21px, 3vw, 32px)",fontWeight:300,color:"#2C2420",lineHeight:2,marginBottom:20,whiteSpace:"pre-line"}}>{data.concept.headline}</h2>
      <p style={S.bd}>{data.concept.body}</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(120px, 1fr))",gap:10,marginTop:28}}>{data.concept.tags.filter(Boolean).map(t=><div key={t} style={S.tg}>{t}</div>)}</div>
    </PSec>

    {/* Plan */}
    <PSec bg="#fff"><Lb en="PLAN" ja="間取り"/>
      <div style={{fontSize:14,color:"#6B6560",fontWeight:300}}>{data.plan.type}</div>
      <div style={{fontSize:12,color:"#A09890",letterSpacing:1,marginBottom:20}}>延床面積 {data.plan.area}㎡（{data.plan.tsubo}坪）　{tR}室</div>
      {data.plan.floors.length>1&&<div style={{display:"flex",marginBottom:20,background:"#F5F3F0",borderRadius:8,padding:3,maxWidth:400}}>{data.plan.floors.map((fl,i)=><button key={i} onClick={()=>setAf(i)} style={{flex:1,padding:"10px 0",border:"none",borderRadius:6,fontSize:12,fontWeight:af===i?600:400,background:af===i?"#fff":"transparent",color:af===i?"#2C2420":"#A09890",cursor:"pointer",letterSpacing:2,boxShadow:af===i?"0 1px 6px rgba(0,0,0,0.08)":"none"}}>{fl.label}</button>)}</div>}

/* ━━━ Gallery Hero ━━━ */
function GH({items,idx,setIdx,onZoom,dark,light,showTag}){
  const si=items.length>0?idx%items.length:0;const c=items[si];const zl=items.filter(v=>v.image);const zi=c?zl.findIndex(v=>v===c):-1;
  return<>{items.length>0&&<div style={{position:"relative",width:"100%",maxHeight:"70vh",aspectRatio:"16/10",overflow:"hidden",cursor:c?.image?"pointer":"default",margin:"0 auto"}} onClick={()=>{if(c?.image)onZoom(c.image,c.label,zl.length>1?zl:null,Math.max(0,zi));}}>
    {c?.image?<img src={c.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:"100%",height:"100%",background:`linear-gradient(135deg, ${GR[si%GR.length]})`}}/>}
    <div style={{position:"absolute",bottom:0,left:0,right:0,height:68,background:light?"linear-gradient(transparent, rgba(245,243,240,0.95))":"linear-gradient(transparent, rgba(26,22,20,0.9))"}}/>
    <div style={{position:"absolute",bottom:14,left:20}}><div style={{fontSize:9,letterSpacing:3,color:dark?"rgba(196,149,106,0.65)":"#A09890"}}>{si+1}/{items.length}</div><div style={{fontSize:15,color:dark?"#fff":"#2C2420",fontWeight:300,letterSpacing:2}}>{c?.label}</div></div>
    {showTag&&c?.tag&&<div style={{position:"absolute",top:14,right:16,fontSize:10,color:"rgba(255,255,255,0.5)",background:"rgba(0,0,0,0.4)",backdropFilter:"blur(8px)",padding:"4px 10px",borderRadius:4}}>{c.tag}</div>}
    {c?.image&&<div style={{position:"absolute",top:showTag?42:14,[dark?"left":"right"]:16}}><div style={{background:"rgba(0,0,0,0.35)",backdropFilter:"blur(6px)",borderRadius:16,padding:"5px 10px",display:"flex",alignItems:"center",gap:4}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg><span style={{fontSize:9,color:"rgba(255,255,255,0.8)"}}>拡大</span></div></div>}
  </div>}
  {items.length>1&&(items.length<=8
    ?<div style={{display:"flex",gap:6,padding:"12px 20px",overflowX:"auto",justifyContent:"center"}}>{items.map((v,i)=><button key={i} onClick={()=>setIdx(i)} style={{flexShrink:0,width:80,height:58,borderRadius:8,overflow:"hidden",border:"none",padding:0,cursor:"pointer",outline:si===i?"2px solid #C4956A":"2px solid transparent",outlineOffset:-2,opacity:si===i?1:0.45,background:"none"}}>{v.image?<img src={v.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>:<div style={{width:"100%",height:"100%",background:`linear-gradient(135deg, ${GR[i%GR.length]})`,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:9,color:"rgba(255,255,255,0.7)"}}>{v.label}</span></div>}</button>)}</div>
    :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(80px, 1fr))",gap:3,padding:"3px 3px 0",maxWidth:800,margin:"0 auto"}}>{items.map((v,i)=><button key={i} onClick={()=>setIdx(i)} style={{aspectRatio:"4/3",borderRadius:4,overflow:"hidden",border:"none",padding:0,cursor:"pointer",position:"relative",opacity:si===i?1:0.5,background:"none",outline:si===i?"2px solid #C4956A":"2px solid transparent",outlineOffset:-2}}>{v.image?<img src={v.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>:<div style={{width:"100%",height:"100%",background:`linear-gradient(135deg, ${GR[i%GR.length]})`}}/>}<div style={{position:"absolute",bottom:0,left:0,right:0,padding:"10px 4px 2px",background:"linear-gradient(transparent, rgba(0,0,0,0.65))"}}><div style={{fontSize:7,color:"rgba(255,255,255,0.85)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.label}</div></div></button>)}</div>
  )}</>;

/* ━━━ Lightbox ━━━ */
function LightBox({src,label,list,index,onClose,onChange}){const[scale,setScale]=useState(1);const[tx,setTx]=useState(0);const[ty,setTy]=useState(0);const ld=useRef(0);const ps=useRef(null);const sp=useRef({tx:0,ty:0});const sx=useRef(0);const hl=list&&list.length>1;
  const reset=()=>{setScale(1);setTx(0);setTy(0);};
  const onTS=useCallback(e=>{if(e.touches.length===2){ld.current=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}else if(e.touches.length===1){ps.current={x:e.touches[0].clientX,y:e.touches[0].clientY};sp.current={tx,ty};sx.current=0;}},[tx,ty]);
  const onTM=useCallback(e=>{e.preventDefault();if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(ld.current>0){const ns=Math.min(Math.max(scale*(d/ld.current),1),5);setScale(ns);if(ns<=1){setTx(0);setTy(0);}}ld.current=d;}else if(e.touches.length===1&&ps.current){const dx=e.touches[0].clientX-ps.current.x;const dy=e.touches[0].clientY-ps.current.y;if(scale>1){setTx(sp.current.tx+dx);setTy(sp.current.ty+dy);}else sx.current=dx;}},[scale]);
  const onTE=useCallback(()=>{ld.current=0;if(scale<=1&&hl&&Math.abs(sx.current)>60){const d=sx.current>0?-1:1;const ni=index+d;if(ni>=0&&ni<list.length){reset();onChange({src:list[ni].image,label:list[ni].label,list,index:ni});}}ps.current=null;sx.current=0;},[scale,hl,index,list,onChange]);
  const dt=useRef(0);const tap=()=>{const n=Date.now();if(n-dt.current<300){if(scale>1)reset();else setScale(2.5);dt.current=0;}else dt.current=n;};
  const go=d=>{if(hl){const ni=index+d;if(ni>=0&&ni<list.length){reset();onChange({src:list[ni].image,label:list[ni].label,list,index:ni});}}};
  return<div style={{position:"fixed",inset:0,zIndex:10000,background:"rgba(0,0,0,0.96)",display:"flex",flexDirection:"column",touchAction:"none"}} onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE} onClick={tap}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",flexShrink:0,zIndex:2}}><button onClick={e=>{e.stopPropagation();onClose();}} style={{background:"none",border:"none",color:"#fff",fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>閉じる</button>{hl&&<div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>{index+1}/{list.length}</div>}<div style={{width:48}}/></div>
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",position:"relative"}}>{src?<img src={src} alt="" style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain",transition:scale===1?"transform 0.2s":"none",transform:`translate(${tx}px,${ty}px) scale(${scale})`,userSelect:"none",pointerEvents:"none"}}/>:null}
      {hl&&index>0&&<button onClick={e=>{e.stopPropagation();go(-1);}} style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",background:"rgba(0,0,0,0.4)",border:"none",borderRadius:"50%",width:40,height:40,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2"><path d="M15 18l-6-6 6-6"/></svg></button>}
      {hl&&index<list.length-1&&<button onClick={e=>{e.stopPropagation();go(1);}} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"rgba(0,0,0,0.4)",border:"none",borderRadius:"50%",width:40,height:40,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg></button>}
    </div>
    <div style={{textAlign:"center",padding:"12px 20px 20px"}}>{label&&<div style={{fontSize:14,color:"rgba(255,255,255,0.7)",letterSpacing:2}}>{label}</div>}<div style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginTop:6}}>{scale>1?"ダブルタップでリセット":hl?"スワイプで前後 / ダブルタップで拡大":"ダブルタップで拡大"}</div></div>
  </div>;
}

/* ━━━ Walkthrough ━━━ */
function WT({url,onClose}){
  useEffect(()=>{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});return()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});};},[]);
  return<div style={{position:"fixed",inset:0,zIndex:9999,background:"#000",display:"flex",flexDirection:"column"}}>
    <iframe src={url} style={{flex:1,width:"100%",border:"none"}} title="3D" allow="fullscreen; gyroscope; accelerometer"/>
    <button onClick={onClose} style={{position:"absolute",top:12,left:12,zIndex:10,background:"rgba(0,0,0,0.6)",backdropFilter:"blur(12px)",border:"1px solid rgba(255,255,255,0.1)",color:"#fff",borderRadius:24,padding:"8px 16px",fontSize:12,cursor:"pointer",letterSpacing:1,display:"flex",alignItems:"center",gap:6}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>閉じる</button>
  </div>;
}

function EExt({d,u}){return<FS t="外観">{d.exterior.views.map((v,i)=>{const img=useImg(b=>u(`exterior.views.${i}.image`,b));return<div key={i} style={{marginBottom:10,padding:12,background:"#fff",borderRadius:10,border:"1px solid #EDEAE6"}}><div style={{display:"flex",gap:6,marginBottom:8}}><input value={v.label} onChange={e=>u(`exterior.views.${i}.label`,e.target.value)} style={{...S.inp,flex:1}} placeholder="正面"/><button onClick={()=>u("exterior.views",d.exterior.views.filter((_,j)=>j!==i))} style={S.xB}>✕</button></div><ImgS src={v.image} go={img.go} cl={()=>u(`exterior.views.${i}.image`,null)}/>{img.el}</div>;})}<button onClick={()=>u("exterior.views",[...d.exterior.views,mkExt("")])} style={S.aB}>＋ 追加</button><Fi l="説明" v={d.exterior.description} s={v=>u("exterior.description",v)} m rows={3}/></FS>;}
function EInt({d,u}){return<FS t="内装">{d.interior.views.map((v,i)=>{const img=useImg(b=>u(`interior.views.${i}.image`,b));return<div key={i} style={{marginBottom:10,padding:12,background:"#fff",borderRadius:10,border:"1px solid #EDEAE6"}}><div style={{display:"flex",gap:6,marginBottom:8}}><input value={v.label} onChange={e=>u(`interior.views.${i}.label`,e.target.value)} style={{...S.inp,flex:1}} placeholder="ビュー名"/><input value={v.tag||""} onChange={e=>u(`interior.views.${i}.tag`,e.target.value)} style={{...S.inp,width:52,textAlign:"center",fontSize:11}} placeholder="タグ"/><button onClick={()=>u("interior.views",d.interior.views.filter((_,j)=>j!==i))} style={S.xB}>✕</button></div><ImgS src={v.image} go={img.go} cl={()=>u(`interior.views.${i}.image`,null)} small/>{img.el}</div>;})}<button onClick={()=>u("interior.views",[...d.interior.views,mkView("","")])} style={S.aB}>＋ 追加</button><Fi l="説明" v={d.interior.description} s={v=>u("interior.description",v)} m rows={3}/></FS>;}
function ESpe({d,u}){return<FS t="仕様">{d.specs.map((s,i)=><div key={i} style={{display:"flex",gap:6,marginBottom:6}}><input value={s.category} onChange={e=>u(`specs.${i}.category`,e.target.value)} style={{...S.inp,width:68}} placeholder="項目"/><input value={s.value} onChange={e=>u(`specs.${i}.value`,e.target.value)} style={{...S.inp,flex:1}} placeholder="内容"/><button onClick={()=>u("specs",d.specs.filter((_,j)=>j!==i))} style={S.xB}>✕</button></div>)}<button onClick={()=>u("specs",[...d.specs,{category:"",value:""}])} style={S.aB}>＋</button></FS>;}
function EPri({d,u}){return<FS t="資金計画">{d.pricing.items.map((it,i)=><div key={i} style={{display:"flex",gap:6,marginBottom:6}}><input value={it.label} onChange={e=>u(`pricing.items.${i}.label`,e.target.value)} style={{...S.inp,flex:1}} placeholder="項目"/><input value={it.amount} onChange={e=>u(`pricing.items.${i}.amount`,e.target.value)} style={{...S.inp,width:110,textAlign:"right"}} placeholder="金額"/><button onClick={()=>u("pricing.items",d.pricing.items.filter((_,j)=>j!==i))} style={S.xB}>✕</button></div>)}<button onClick={()=>u("pricing.items",[...d.pricing.items,{label:"",amount:""}])} style={S.aB}>＋</button><Fi l="合計" v={d.pricing.total} s={v=>u("pricing.total",v)} p="3,100万円"/><Fi l="備考" v={d.pricing.notes} s={v=>u("pricing.notes",v)} m rows={2}/></FS>;}
function ECon2({d,u}){return<FS t="連絡先"><Fi l="電話" v={d.contact.phone} s={v=>u("contact.phone",v)}/><Fi l="受付" v={d.contact.hours} s={v=>u("contact.hours",v)}/><Fi l="住所" v={d.contact.address} s={v=>u("contact.address",v)}/></FS>;}

/* ━━━ Shared ━━━ */
function Sh({children,full}){return<div style={{...S.shell,maxWidth:full?"none":"640px"}}>{children}</div>;}
function PSec({children,bg,last}){return<div style={{padding:last?"72px 5vw 80px":"72px 5vw",background:bg}}><div style={{maxWidth:800,margin:"0 auto"}}>{children}</div></div>;}
function useImg(cb){const r=useRef(null);const el=<input ref={r} type="file" accept="image/*" onChange={e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>cb(ev.target.result);rd.readAsDataURL(f);e.target.value="";}} style={{display:"none"}}/>;return{go:()=>r.current?.click(),el};}
function up(sd,p,v){sd(prev=>{const n=JSON.parse(JSON.stringify(prev));const k=p.split(".");let o=n;for(let i=0;i<k.length-1;i++)o=/^\d+$/.test(k[i])?o[+k[i]]:o[k[i]];const l=k[k.length-1];o[/^\d+$/.test(l)?+l:l]=v;return n;});}
function Sec({children,bg,last}){return<div style={{padding:last?"72px 28px 80px":"72px 28px",background:bg}}>{children}</div>;}
function Lb({en,ja,dark,center}){return<div style={{marginBottom:24,textAlign:center?"center":"left"}}><div style={{fontSize:10,letterSpacing:5,color:dark?"rgba(196,149,106,0.45)":"#A09890",fontWeight:500}}>{en}</div><div style={{fontSize:14,letterSpacing:3,color:dark?"rgba(255,255,255,0.8)":"#2C2420",fontWeight:300,marginTop:5}}>{ja}</div><div style={{width:22,height:1,background:"#C4956A",marginTop:14,marginLeft:center?"auto":0,marginRight:center?"auto":0}}/></div>;}
function FS({t,children}){return<div><div style={{fontSize:14,fontWeight:600,color:"#2C2420",letterSpacing:1,marginBottom:20}}>{t}</div>{children}</div>;}
function Fi({l,v,s,p,m,rows=2,type}){return<div style={{marginBottom:14}}><div style={S.fl}>{l}</div>{m?<textarea value={v} onChange={e=>s(e.target.value)} placeholder={p} rows={rows} style={{...S.inp,resize:"vertical",minHeight:rows*24}}/>:<input type={type||"text"} value={v} onChange={e=>s(e.target.value)} placeholder={p} style={S.inp}/>}</div>;}
function ImgS({src,go,cl,tall,small}){if(src)return<div style={{position:"relative",marginBottom:6}}><img src={src} alt="" style={{width:"100%",borderRadius:8,display:"block",maxHeight:tall?200:small?90:140,objectFit:"cover"}}/><button onClick={cl} style={{position:"absolute",top:5,right:5,background:"rgba(0,0,0,0.5)",color:"#fff",border:"none",borderRadius:"50%",width:22,height:22,fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button></div>;return<button onClick={go} style={{width:"100%",height:tall?120:small?56:88,border:"1.5px dashed #D5D0CA",borderRadius:8,background:"#FAFAF8",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6,marginBottom:6}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B5AFA8" strokeWidth="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span style={{fontSize:10,color:"#A09890"}}>画像を選択</span></button>;}

const S={
  shell:{width:"100%",maxWidth:640,margin:"0 auto",height:"100%",background:"#FAF8F5",position:"relative",overflow:"hidden",display:"flex",flexDirection:"column"},
  eH:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:"1px solid #EDEAE6",background:"#fff",flexShrink:0},
  smB:{border:"none",borderRadius:6,padding:"7px 11px",fontSize:11,fontWeight:500,cursor:"pointer",letterSpacing:1},
  tB:{display:"flex",overflowX:"auto",borderBottom:"1px solid #EDEAE6",background:"#fff",flexShrink:0,padding:"0 6px"},
  tI:{background:"none",border:"none",padding:"11px 9px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap",letterSpacing:1},
  eB:{flex:1,overflowY:"auto",padding:"20px 18px 40px",WebkitOverflowScrolling:"touch"},
  fl:{fontSize:11,color:"#8B8580",fontWeight:500,marginBottom:5,letterSpacing:1},
  inp:{width:"100%",padding:"9px 11px",border:"1px solid #E5E0DA",borderRadius:7,fontSize:13,color:"#2C2420",background:"#fff",outline:"none",lineHeight:1.6},
  aB:{width:"100%",padding:"9px 0",border:"1px dashed #D5D0CA",borderRadius:7,background:"none",fontSize:11,color:"#A09890",cursor:"pointer"},
  xB:{background:"none",border:"none",color:"#CCC5BE",fontSize:13,cursor:"pointer",padding:3,lineHeight:1},
  sc:{flex:1,overflowY:"auto",scrollBehavior:"smooth",WebkitOverflowScrolling:"touch"},
  bk:{position:"fixed",top:12,left:"50%",transform:"translateX(-50%)",zIndex:100,background:"rgba(44,36,32,0.85)",backdropFilter:"blur(12px)",color:"#fff",border:"none",borderRadius:20,padding:"8px 16px",fontSize:11,fontWeight:500,cursor:"pointer",letterSpacing:1},
  bd:{fontSize:"clamp(13px, 1.5vw, 15px)",lineHeight:2.2,color:"#6B6560",fontWeight:300},
  tg:{padding:"14px 12px",background:"#fff",borderRadius:8,textAlign:"center",fontSize:12,color:"#2C2420",fontWeight:500,letterSpacing:2,boxShadow:"0 2px 10px rgba(0,0,0,0.03)"},
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
