function compressImage(file,maxPx=1920,quality=0.85){
  return new Promise(res=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.width,h=img.height;
      if(w>maxPx||h>maxPx){if(w>h){h=Math.round(h*(maxPx/w));w=maxPx;}else{w=Math.round(w*(maxPx/h));h=maxPx;}}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      const supWebP=c.toDataURL("image/webp").startsWith("data:image/webp");
      res(supWebP?c.toDataURL("image/webp",quality):c.toDataURL("image/jpeg",quality));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);const r2=new FileReader();r2.onload=e2=>res(e2.target.result);r2.readAsDataURL(file);};
    img.src=url;
  });
}
function readAsBase64(file){return new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});}

// 保存時: data:URLを全収集→並列アップロード→置換
async function uploadPendingImages(obj,onProg){
  const b64Map=new Map();
  (function scan(o){if(!o)return;if(typeof o==="string"&&o.startsWith("data:"))b64Map.set(o,null);else if(Array.isArray(o))o.forEach(scan);else if(typeof o==="object")Object.values(o).forEach(scan);})(obj);
  if(!b64Map.size)return obj;
  let done=0;const total=b64Map.size;const queue=[...b64Map.keys()];const CONCUR=3;
  async function worker(){let item;while((item=queue.shift())!==undefined){try{b64Map.set(item,await uploadImage(item));}catch(e){b64Map.set(item,null);}done++;onProg&&onProg(done,total);}}
  await Promise.all(Array.from({length:Math.min(CONCUR,total)},worker));
  function replace(o){if(!o)return o;if(typeof o==="string")return b64Map.has(o)?(b64Map.get(o)||o):o;if(Array.isArray(o))return o.map(replace);if(typeof o==="object"){const r={};for(const[k,v] of Object.entries(o))r[k]=replace(v);return r;}return o;}
  return replace(JSON.parse(JSON.stringify(obj)));
}
// 削除差分用: R2 URLのキーを全抽出
function extractR2Keys(obj,keys=new Set()){
  if(!obj)return keys;
  if(typeof obj==="string"){const m=obj.match(/\/api\/images\/(.+)$/);if(m)keys.add(m[1]);}
  else if(Array.isArray(obj))obj.forEach(v=>extractR2Keys(v,keys));
  else if(typeof obj==="object")Object.values(obj).forEach(v=>extractR2Keys(v,keys));
  return keys;
}
// 圧縮のみ並列
async function compressParallel(files,onProgress){
  const CONCUR=3;const results=new Array(files.length).fill(null);let done=0;
  const queue=[...files.entries()];
  async function worker(){while(queue.length){const[i,f]=queue.shift();try{results[i]=await cup(f);}catch(e){results[i]=null;}done++;onProgress&&onProgress(done,files.length);}}
  await Promise.all(Array.from({length:Math.min(CONCUR,files.length)},worker));
  return results;
}

  const[sc,setSc]=useState(1);const[tx,setTx]=useState(0);const[ty,setTy]=useState(0);const ld=useRef(0);const ps=useRef(null);const sp=useRef({tx:0,ty:0});

function App(){const[mode,setMode]=useState("loading");const[data,setData]=useState(DEFAULT);const[tab,setTab]=useState("basic");const[shareId,setShareId]=useState(null);const[err,setErr]=useState(null);const[saving,setSaving]=useState(false);const[saveProg,setSaveProg]=useState("");const lastSavedRef=useRef(null);
  function migrate(d){if(d.plans&&!Array.isArray(d.plans)){const arr=[];for(const k of["a","b","c"])if(d.plans[k]){const p=d.plans[k];p.color=PLAN_COLORS[arr.length%PLAN_COLORS.length];arr.push(p);}d.plans=arr;}if(d.comparison?.[0]&&!Array.isArray(d.comparison[0].values))d.comparison=d.comparison.map(r=>({label:r.label,values:[r.a||"",r.b||"",r.c||""]}));if(!d.dataType)d.dataType="multi";if(!d.updatedAt)d.updatedAt=null;

    if(d.plans){(Array.isArray(d.plans)?d.plans:Object.values(d.plans)).forEach(p=>{delete p.coverImage;if(p.floors)p.floors.forEach(fl=>{if(!fl.markers)fl.markers=[];});});}return d;}
  useEffect(()=>{const hash=location.hash.replace("#","");const p=new URLSearchParams(location.search);if(hash&&hash.length>=4&&p.get("v")==="1"){loadP(hash).then(r=>{if(r?.data){setData(migrate(r.data));setMode("customer");}else setMode("notfound");}).catch(()=>setMode("notfound"));return;}if(getKey()){if(hash&&hash.length>=4){loadP(hash).then(r=>{if(r?.data){const d=migrate(r.data);setData(d);lastSavedRef.current=d;setShareId(hash);}setMode("edit");}).catch(()=>setMode("edit"));}else setMode("edit");}else setMode("login");},[]);
  const hLogin=async k=>{setKey(k);try{await listP();setMode("edit");}catch(e){setKey("");throw e;}};
  const hSave=async()=>{
    const name=(data.customerName||"").trim();

    if(!id&&name){const map=getNameIdMap("multi");id=map[name]||genId();}
    else if(!id)id=genId();

      if(lastSavedRef.current){
        const oldKeys=extractR2Keys(lastSavedRef.current);

        if(toDelete.length){setSaveProg(`不要画像 ${toDelete.length}件 削除中...`);await Promise.allSettled(toDelete.map(k=>api(`/api/images/${k}`,{method:"DELETE",auth:true})));}

        <div style={{marginBottom:40}}><div style={{display:"flex",gap:6,marginBottom:20,background:th.accentLight,borderRadius:12,padding:4,maxWidth:360}}>{plan.floors.map((fl,i)=><button key={i} onClick={()=>setFloorIdx(p=>{const n=[...p];n[activePlan]=i;return n;})} style={{flex:1,padding:"12px 0",border:"none",borderRadius:9,fontSize:13,fontWeight:500,letterSpacing:2,cursor:"pointer",background:(floorIdx[activePlan]||0)===i?"#fff":"transparent",color:(floorIdx[activePlan]||0)===i?th.dark:"#A09890",transition:"all .25s"}}>{fl.label}</button>)}</div>
          <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:24}}><div style={{display:"flex",background:"#F0EDE8",borderRadius:10,padding:3}}><button onClick={()=>setBaMode(p=>{const n=[...p];n[activePlan]="before";return n;})} style={{padding:"10px 24px",border:"none",borderRadius:8,fontSize:12,fontWeight:500,letterSpacing:2,cursor:"pointer",background:!isAfter?"#fff":"transparent",color:!isAfter?th.dark:"#A09890",transition:"all .3s"}}>BEFORE</button><button onClick={()=>setBaMode(p=>{const n=[...p];n[activePlan]="after";return n;})} style={{padding:"10px 24px",border:"none",borderRadius:8,fontSize:12,fontWeight:500,letterSpacing:2,cursor:"pointer",background:isAfter?"#fff":"transparent",color:isAfter?th.dark:"#A09890",transition:"all .3s"}}>AFTER</button></div></div>
          <div style={{borderRadius:16,overflow:"hidden",background:th.accentLight,position:"relative",cursor:floorSrc?"pointer":"default"}} onClick={()=>{if(floorSrc)setLb(floorSrc);}}>
            <div style={{position:"absolute",top:16,left:16,padding:"6px 14px",borderRadius:8,fontSize:11,fontWeight:600,letterSpacing:3,zIndex:4,backdropFilter:"blur(10px)",background:isAfter?"rgba(196,149,106,0.85)":"rgba(0,0,0,0.55)",color:"#fff"}}>{isAfter?"AFTER":"BEFORE"}</div>
            {floorSrc?<><img src={iSrc(floorSrc)} alt="" style={{width:"100%",display:"block"}}/>{hasMarkers&&<Pins markers={curPlanFloor.markers} rooms={plan.rooms} color={pc} onPinClick={num=>{scrollToRoom(num);}}/>}</>:<div style={{aspectRatio:"4/3",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,color:"#C4B5A0"}}><span style={{fontSize:13,letterSpacing:2}}>{curPlanFloor?.label} {isAfter?"AFTER":"BEFORE"}</span></div>}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:56,marginTop:56}}>{plan.rooms.filter(r=>r.name).map((rm,ri)=><div key={ri} id={`room-${activePlan}-${ri}`} style={{position:"relative"}}>
          <div style={{position:"absolute",top:-12,left:-8,width:52,height:52,borderRadius:"50%",background:`linear-gradient(135deg,${pc}CC,${pc})`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Cormorant Garamond',serif",fontSize:22,fontWeight:600,color:"#fff",boxShadow:`0 4px 20px ${pc}44`,zIndex:2}}>{ri+1}</div>
          <div style={{background:"#fff",borderRadius:16,border:`1px solid ${th.tagBorder}`,overflow:"hidden",position:"relative"}}><div style={{position:"absolute",top:0,left:0,right:0,height:3,background:pc}}/>
            {(rm.images||[]).length>0&&<div style={{paddingTop:3}}><img src={iSrc(rm.images[imgIdx[`${activePlan}-${ri}`]||0]||rm.images[0])} alt="" onClick={()=>setLb(rm.images[imgIdx[`${activePlan}-${ri}`]||0]||rm.images[0])} style={{width:"100%",aspectRatio:"16/10",objectFit:"cover",display:"block",cursor:"pointer"}}/>{rm.images.length>1&&<div style={{display:"flex",gap:4,padding:4,background:"#F8F6F3"}}>{rm.images.map((img,ii)=><button key={ii} onClick={()=>setImgIdx(p=>({...p,[`${activePlan}-${ri}`]:ii}))} style={{width:68,height:48,borderRadius:6,overflow:"hidden",border:(imgIdx[`${activePlan}-${ri}`]||0)===ii?`2px solid ${pc}`:"2px solid transparent",padding:0,cursor:"pointer",flexShrink:0,background:"none"}}><img src={iSrc(img)} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/></button>)}</div>}</div>}
            {(rm.points||[]).filter(p=>p.label).length>0&&<div style={{padding:24}}><div style={{fontSize:11,letterSpacing:4,fontWeight:600,color:pc,marginBottom:16,display:"flex",alignItems:"center",gap:8}}>REFORM POINT<span style={{flex:1,height:1,background:th.tagBorder}}/></div>{(rm.points||[]).filter(p=>p.label).map((pt,pti)=><div key={pti} style={{display:"flex",gap:14,padding:"14px 0",borderBottom:pti<rm.points.filter(p=>p.label).length-1?"1px solid #F0EDE8":"none"}}><div style={{width:32,height:32,borderRadius:8,background:th.accentLight,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:14}}>{pt.icon}</div><div><div style={{fontSize:13,fontWeight:600,letterSpacing:1,marginBottom:4}}>{pt.label}</div><div style={{fontSize:12,color:"#6B6560",lineHeight:1.9,fontWeight:300}}>{pt.desc}</div></div></div>)}</div>}
          </div>
        </div>)}</div>
        {plan.pricing.items.filter(i=>i.label).length>0&&<div style={{marginTop:56,background:"#fff",borderRadius:16,padding:32,border:`1px solid ${th.tagBorder}`}}><h3 style={{fontSize:16,fontWeight:600,letterSpacing:2,marginBottom:20}}>Plan {activePlan+1} 概算費用</h3>{plan.pricing.items.filter(i=>i.label).map((it,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"14px 0",borderBottom:"1px solid #F0EDE8"}}><span style={{fontSize:13,color:"#6B6560"}}>{it.label}</span><span style={{fontSize:14,fontWeight:500,color:pc}}>{it.amount||"—"}</span></div>)}{plan.pricing.total&&<div style={{marginTop:16,padding:"20px 0 0",borderTop:`2px solid ${th.dark}`,display:"flex",justifyContent:"space-between",alignItems:"baseline"}}><span style={{fontSize:13,fontWeight:600,letterSpacing:2}}>合計（税込）</span><span style={{fontSize:28,fontWeight:300,color:pc}}>{plan.pricing.total}</span></div>}</div>}
      </div>
    </PSec>
    {plans.length>1&&<PSec bg={th.darkBg} style={{color:"#fff"}}><PLbl accent={th.accent} en="Comparison" ja="プラン比較" dark center/><InView><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",minWidth:plans.length*140+120}}><thead><tr><th style={{padding:"16px 12px",textAlign:"left",fontSize:12,color:"rgba(255,255,255,0.4)",letterSpacing:2,borderBottom:"1px solid rgba(255,255,255,0.08)",fontWeight:400,width:"24%"}}></th>{plans.map((p,i)=>{const c=p.color||PLAN_COLORS[i%PLAN_COLORS.length];return<th key={i} style={{padding:"16px 12px",textAlign:"center",borderBottom:"1px solid rgba(255,255,255,0.08)"}}><div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><div style={{width:28,height:28,borderRadius:7,background:c,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Cormorant Garamond',serif",fontSize:13,color:"#fff",fontWeight:600}}>{i+1}</div><div style={{fontSize:13,color:c,fontWeight:600,letterSpacing:2}}>{p.name||`プラン${i+1}`}</div></div></th>;})}</tr></thead><tbody style={{fontSize:12,color:"rgba(255,255,255,0.6)"}}>{(data.comparison||[]).filter(r=>r.label).map((r,i)=><tr key={i}><td style={{padding:"14px 12px",borderBottom:"1px solid rgba(255,255,255,0.05)",fontWeight:500,color:"rgba(255,255,255,.35)",letterSpacing:1}}>{r.label}</td>{(r.values||[]).slice(0,plans.length).map((v,vi)=><td key={vi} style={{padding:"14px 12px",borderBottom:"1px solid rgba(255,255,255,0.05)",textAlign:"center"}}>{v}</td>)}</tr>)}<tr><td style={{padding:"14px 12px",fontWeight:500,color:"rgba(255,255,255,.35)",letterSpacing:1}}>概算合計</td>{plans.map((p,i)=><td key={i} style={{padding:"14px 12px",textAlign:"center",fontSize:16,fontWeight:500,color:p.color||PLAN_COLORS[i%PLAN_COLORS.length]}}>{p.pricing?.total||"─"}</td>)}</tr></tbody></table></div></InView>{data.notes&&<div style={{marginTop:24,textAlign:"center",fontSize:11,color:"rgba(255,255,255,.2)",letterSpacing:1}}>※ {data.notes}</div>}</PSec>}
    <div style={{textAlign:"center",padding:"60px 20px",background:th.darkBg}}>{data.expiresAt&&<div style={{fontSize:10,color:"rgba(255,255,255,0.25)",letterSpacing:1,marginBottom:16}}>閲覧期限：{fmtDateShort(data.expiresAt)}</div>}<div style={{fontSize:12,color:"rgba(255,255,255,0.2)",letterSpacing:3}}>喜多ハウジング株式会社</div><div style={{fontSize:9,color:"rgba(255,255,255,0.08)",letterSpacing:4,marginTop:24}}>© 2026 KITA HOUSING CO., LTD.</div></div>
  </>;}

/* ━━━ A3 Print Layout (Landscape) ━━━ */
function PrintLayout({data,onDone}){
  const th=T(data);const plans=data.plans||[];
  const PS={
    page:{width:"420mm",minHeight:"297mm",padding:"10mm 14mm",pageBreakAfter:"always",position:"relative",overflow:"hidden",background:"#fff",fontFamily:"'Noto Sans JP','Hiragino Sans',sans-serif"},
    pageLast:{pageBreakAfter:"auto"},
    hdr:{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:8,borderBottom:`2px solid ${th.accent}`,marginBottom:12},
    sec:{marginBottom:14},
    secTitle:{fontSize:8,letterSpacing:6,color:th.accent,textTransform:"uppercase",marginBottom:3},
    secJa:{fontSize:13,letterSpacing:4,fontWeight:300,color:th.dark,marginBottom:3},
    secLine:{width:22,height:1.5,background:th.accent,borderRadius:1,marginBottom:8},
    card:{background:"#fff",border:`1px solid ${th.tagBorder}`,borderRadius:6,overflow:"hidden"},
    tag:{display:"inline-block",padding:"3px 10px",borderRadius:5,fontSize:7,fontWeight:500,letterSpacing:2,border:`1px solid ${th.tagBorder}`,color:th.dark},
    roomNum:{width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Cormorant Garamond',serif",fontSize:10,fontWeight:700,color:"#fff",flexShrink:0},
    pt:{display:"flex",gap:5,padding:"3px 0",borderBottom:"1px solid #F0EDE8",fontSize:8,lineHeight:1.5},
    ptLast:{borderBottom:"none"},
    ptIcon:{width:16,height:16,borderRadius:3,background:th.accentLight,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,flexShrink:0},
    footer:{position:"absolute",bottom:8,left:14,right:14,display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:7,color:"#CCC5BE",letterSpacing:2},
  };
  const Header=()=><div style={PS.hdr}><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:8,letterSpacing:5,color:th.accent,fontWeight:500}}>KITA HOUSING</span><span style={{fontSize:7,color:"#D5D0CA"}}>│</span><span style={{fontSize:10,color:"#A09890",letterSpacing:2}}>{data.planTitle}</span></div><div style={{fontSize:10,fontWeight:500,color:th.dark,letterSpacing:2}}>{data.customerName?`${data.customerName} 様邸`:""}</div></div>;
  const Footer=({page,total})=><div style={PS.footer}><span>喜多ハウジング株式会社{data.staffName?` ─ 担当：${data.staffName}`:""}</span><span>{page} / {total}</span></div>;
  const totalPages=1+plans.length;

  return<div style={{width:"100%",height:"100%",overflow:"auto",background:"#E5E0DA"}}>
    <PrintTrigger onDone={onDone}/>

    {/* ═══ PAGE 1: Cover + Concept + Overview + Comparison (landscape) ═══ */}
    <div className="a3-page" style={PS.page}>
      {/* Cover hero — wide landscape banner */}
      <div style={{background:th.coverGrad,borderRadius:10,padding:"20mm 24mm",marginBottom:14,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",inset:0,background:"url(\"data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E\")"}}/>
        {data.coverImage&&<img src={iSrc(data.coverImage)} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",opacity:.2}}/>}
        <div style={{position:"absolute",inset:0,background:"linear-gradient(135deg,transparent 40%,rgba(0,0,0,0.3))"}}/>
        <div style={{position:"relative",zIndex:2,display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
          <div>
            <div style={{fontSize:7,letterSpacing:6,color:th.accent,marginBottom:8}}>REFORM PLAN</div>
            <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:32,fontWeight:300,color:"#fff",lineHeight:1.3,letterSpacing:2}}>{data.customerName?`${data.customerName} 様邸`:"○○様邸"}</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",letterSpacing:4,marginTop:4,fontWeight:300}}>{data.planTitle}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{width:36,height:1.5,background:th.accent,marginBottom:8,borderRadius:1,marginLeft:"auto"}}/>
            <div style={{fontSize:8,color:"rgba(255,255,255,0.3)",letterSpacing:3}}>喜多ハウジング株式会社</div>
            {data.staffName&&<div style={{fontSize:8,color:"rgba(255,255,255,0.25)",marginTop:2}}>担当：{data.staffName}</div>}
          </div>
        </div>
      </div>

      {/* 2-column: Concept left, Overview + Comparison right */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        <div>
          <div style={PS.sec}>
            <div style={PS.secTitle}>CONCEPT</div>
            <div style={PS.secJa}>リフォームコンセプト</div>
            <div style={PS.secLine}/>
            <div style={{fontSize:16,fontWeight:300,lineHeight:1.8,letterSpacing:1,marginBottom:6,whiteSpace:"pre-line",color:th.dark}}>{data.concept.headline}</div>
            <div style={{fontSize:9,lineHeight:1.9,color:"#6B6560",fontWeight:300,marginBottom:10}}>{data.concept.body}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{data.concept.tags.filter(Boolean).map(t=><span key={t} style={PS.tag}>{t}</span>)}</div>
          </div>
        </div>
        <div>
          {/* Plan overview cards */}
          <div style={PS.sec}>
            <div style={PS.secTitle}>PLAN OVERVIEW</div>
            <div style={PS.secLine}/>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {plans.map((p,i)=>{const c=p.color||PLAN_COLORS[i%PLAN_COLORS.length];return<div key={i} style={{...PS.card,borderLeft:`3px solid ${c}`,padding:"10px 12px",display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:24,height:24,borderRadius:6,background:c,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Cormorant Garamond',serif",fontSize:12,color:"#fff",fontWeight:600,flexShrink:0}}>{i+1}</div>
                <div style={{flex:1}}><div style={{fontSize:10,fontWeight:600,letterSpacing:1}}>Plan {i+1} ─ {p.name}</div><div style={{fontSize:8,color:"#6B6560",marginTop:1}}>{p.desc}</div></div>
                {p.pricing.total&&<div style={{fontSize:13,fontWeight:300,color:c,flexShrink:0}}>{p.pricing.total}</div>}
              </div>;})}
            </div>
          </div>

          {/* Comparison table */}
          {plans.length>1&&(data.comparison||[]).filter(r=>r.label).length>0&&<div style={PS.sec}>
            <div style={PS.secTitle}>COMPARISON</div>
            <div style={PS.secLine}/>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:8}}>
              <thead><tr style={{borderBottom:`1.5px solid ${th.dark}`}}>
                <th style={{padding:"5px 6px",textAlign:"left",color:"#A09890",fontWeight:400,letterSpacing:1,width:"22%"}}></th>
                {plans.map((p,i)=>{const c=p.color||PLAN_COLORS[i%PLAN_COLORS.length];return<th key={i} style={{padding:"5px 6px",textAlign:"center",color:c,fontWeight:600,letterSpacing:1}}>{p.name||`Plan ${i+1}`}</th>;})}
              </tr></thead>
              <tbody>{(data.comparison||[]).filter(r=>r.label).map((r,i)=><tr key={i} style={{borderBottom:"1px solid #F0EDE8"}}>
                <td style={{padding:"4px 6px",color:"#A09890",fontWeight:500}}>{r.label}</td>
                {(r.values||[]).slice(0,plans.length).map((v,vi)=><td key={vi} style={{padding:"4px 6px",textAlign:"center",color:th.dark}}>{v}</td>)}
              </tr>)}
              <tr style={{borderTop:`1.5px solid ${th.dark}`}}><td style={{padding:"5px 6px",fontWeight:600,color:th.dark}}>概算合計</td>{plans.map((p,i)=><td key={i} style={{padding:"5px 6px",textAlign:"center",fontSize:11,fontWeight:500,color:p.color||PLAN_COLORS[i%PLAN_COLORS.length]}}>{p.pricing?.total||"─"}</td>)}</tr>
              </tbody>
            </table>
            {data.notes&&<div style={{marginTop:4,fontSize:7,color:"#B5AFA8",letterSpacing:1}}>※ {data.notes}</div>}
          </div>}
        </div>
      </div>
      <Footer page={1} total={totalPages}/>
    </div>

    {/* ═══ PAGE 2+: Per plan detail (landscape) ═══ */}
    {plans.map((plan,pi)=>{const c=plan.color||PLAN_COLORS[pi%PLAN_COLORS.length];const rooms=plan.rooms.filter(r=>r.name);const afterFloors=plan.floors.filter(f=>f.after);
    return<div key={pi} className="a3-page" style={{...PS.page,...(pi===plans.length-1?PS.pageLast:{})}}>
      <Header/>

      {/* Plan title bar */}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,padding:"10px 14px",background:th.accentLight,borderRadius:8,borderLeft:`4px solid ${c}`}}>
        <div style={{width:30,height:30,borderRadius:8,background:c,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Cormorant Garamond',serif",fontSize:15,color:"#fff",fontWeight:600}}>{pi+1}</div>
        <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,letterSpacing:2}}>Plan {pi+1} ─ {plan.name}</div><div style={{fontSize:8,color:"#A09890",marginTop:1}}>{plan.desc}</div></div>
        {plan.pricing.total&&<div style={{fontSize:16,fontWeight:300,color:c,letterSpacing:1}}>{plan.pricing.total}</div>}
      </div>

      {/* Landscape 2-column: AFTER floor plans left, Room cards right */}
      <div style={{display:"grid",gridTemplateColumns:afterFloors.length>0?"2fr 3fr":"1fr",gap:14}}>
        {/* Left: AFTER floor plans */}
        {afterFloors.length>0&&<div>
          <div style={{fontSize:8,letterSpacing:4,color:c,marginBottom:6,fontWeight:600}}>AFTER PLAN</div>
          {afterFloors.map((fl,fi)=><div key={fi} style={{marginBottom:fi<afterFloors.length-1?8:0}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}><span style={{fontSize:7,letterSpacing:2,color:c,fontWeight:600}}>AFTER</span><span style={{fontSize:8,color:"#B5AFA8"}}>─ {fl.label}</span></div>
            <div style={{borderRadius:6,overflow:"hidden",border:`1px solid ${c}44`,position:"relative"}}><img src={iSrc(fl.after)} alt="" style={{width:"100%",display:"block"}}/>{(fl.markers||[]).length>0&&<Pins markers={fl.markers} rooms={rooms} color={c}/>}</div>
          </div>)}
        </div>}

        {/* Right: Room cards grid */}
        <div>
          {rooms.length>0&&<>
            <div style={{fontSize:8,letterSpacing:4,color:c,marginBottom:6,fontWeight:600}}>ROOM DETAILS</div>
            <div style={{display:"grid",gridTemplateColumns:rooms.length===1?"1fr":"1fr 1fr",gap:6}}>
              {rooms.map((rm,ri)=><div key={ri} style={{...PS.card,display:"flex",flexDirection:"column"}}>
                <div style={{position:"relative"}}><div style={{position:"absolute",top:4,left:4,zIndex:1,...PS.roomNum,background:c,boxShadow:"0 1px 4px rgba(0,0,0,0.2)"}}>{ri+1}</div>
                {(rm.images||[]).length>0?<img src={iSrc(rm.images[0])} alt="" style={{width:"100%",aspectRatio:"16/9",objectFit:"cover",display:"block"}}/>:<div style={{height:6,background:c,opacity:.15}}/>}</div>
                {(rm.points||[]).filter(p=>p.label).length>0&&<div style={{padding:"5px 8px",flex:1}}>
                  {(rm.points||[]).filter(p=>p.label).map((pt,pti,arr)=><div key={pti} style={{...PS.pt,...(pti===arr.length-1?PS.ptLast:{})}}>
                    <div style={PS.ptIcon}>{pt.icon}</div>
                    <div style={{flex:1}}><div style={{fontWeight:600,marginBottom:1,fontSize:8}}>{pt.label}</div><div style={{color:"#6B6560",fontSize:7,lineHeight:1.4}}>{pt.desc}</div></div>
                  </div>)}
                </div>}
              </div>)}
            </div>
          </>}
        </div>
      </div>

      {/* Pricing bar at bottom */}
      {plan.pricing.items.filter(i=>i.label).length>0&&<div style={{marginTop:10,padding:"8px 14px",background:th.accentLight,borderRadius:8,display:"flex",alignItems:"center",gap:16}}>
        <div style={{fontSize:8,letterSpacing:3,color:c,fontWeight:600}}>PRICE</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:"0 20px",flex:1}}>
          {plan.pricing.items.filter(i=>i.label).map((it,i)=><div key={i} style={{display:"flex",gap:8,fontSize:8,padding:"2px 0"}}><span style={{color:"#6B6560"}}>{it.label}</span><span style={{fontWeight:500,color:th.dark}}>{it.amount||"─"}</span></div>)}
        </div>
        {plan.pricing.total&&<div style={{display:"flex",alignItems:"baseline",gap:8,flexShrink:0}}><span style={{fontSize:9,fontWeight:600,letterSpacing:2}}>合計（税込）</span><span style={{fontSize:16,fontWeight:300,color:c}}>{plan.pricing.total}</span></div>}
      </div>}

    {rows.map((r,i)=>{const sr=syncRow(r);return<div key={i} style={{display:"grid",gridTemplateColumns:`100px repeat(${plans.length},1fr) 28px`,gap:4,marginBottom:6}}><input value={sr.label} onChange={e=>{const a=rows.map((x,j)=>j===i?{...syncRow(x),label:e.target.value}:syncRow(x));u(a);}} style={{...S.inp,fontWeight:600,fontSize:11}} placeholder="項目"/>{sr.values.map((v,vi)=><input key={vi} value={v} onChange={e=>{const a=rows.map((x,j)=>{const s=syncRow(x);if(j===i){const nv=[...s.values];nv[vi]=e.target.value;return{...s,values:nv};}return s;});u(a);}} style={{...S.inp,fontSize:11,textAlign:"center"}} placeholder="─"/>)}<button onClick={()=>u(rows.filter((_,j)=>j!==i))} style={S.xB}>✕</button></div>;})}
    <button onClick={()=>u([...rows,{label:"",values:plans.map(()=>"─")}])} style={S.aB}>＋ 行を追加</button><div style={{marginTop:16}}><Fi l="注記" v={d.notes} s={v=>up(sd,"notes",v)} m rows={2}/></div></FS>;}

function Login({onDone}){const[k,setK]=useState("");const[t,setT]=useState(false);const[e,setE]=useState(null);return<div style={{...S.shell,alignItems:"center",justifyContent:"center",padding:24,maxWidth:"none"}}><div style={{width:"100%",maxWidth:360}}><div style={{textAlign:"center",marginBottom:40}}><div style={{fontSize:9,letterSpacing:6,color:"#A09890"}}>KITA HOUSING</div><div style={{fontSize:20,fontWeight:300,letterSpacing:2,marginTop:8}}>リフォームプラン</div><div style={{width:30,height:1,background:"#C4956A",margin:"16px auto"}}/></div><div style={{background:"#fff",borderRadius:12,padding:24}}><div style={{fontSize:14,fontWeight:600,marginBottom:16}}>スタッフログイン</div><Fi l="APIキー" v={k} s={setK} p="キーを入力" type="password"/>{e&&<div style={{padding:12,background:"#FFF0F0",borderRadius:8,fontSize:11,color:"#C44",marginBottom:12}}>{e}</div>}<button onClick={async()=>{setT(true);setE(null);try{await onDone(k);}catch(ex){setE(ex.message);}setT(false);}} disabled={!k||t} style={{width:"100%",padding:"14px 0",background:k?"#2C2420":"#E5E0DA",color:k?"#fff":"#A09890",border:"none",borderRadius:8,fontSize:13,fontWeight:500,cursor:k?"pointer":"default"}}>{t?"確認中...":"ログイン"}</button></div></div></div>;}

function ListWrap({onLoad,onBack}){const[list,setList]=useState([]);const[ld,setLd]=useState(true);const[q,setQ]=useState("");const[sort,setSort]=useState("date-desc");const impRef=useRef(null);
  useEffect(()=>{listP().then(r=>{const items=r||[];setLd(false);
    const now=new Date().toISOString();const results=[];let done=0;
    if(items.length===0){setList([]);return;}
    items.forEach(it=>{loadP(it.id).then(full=>{const d=full?.data;if(!d?.dataType||d.dataType==="multi"){const exp=d?.expiresAt||calcExpiry(d?.updatedAt);if(exp&&exp<now){delWithImages(it.id,d).catch(()=>{});}else{results.push({...it,updatedAt:d?.updatedAt,expiresAt:exp,_data:d});}}}).catch(()=>{}).finally(()=>{done++;if(done===items.length||done%5===0)setList([...results]);});});
  }).catch(()=>setLd(false));},[]);
  const filtered=useMemo(()=>{let f=list;if(q){const lq=q.toLowerCase();f=f.filter(i=>(i.customerName||"").toLowerCase().includes(lq)||(i.planTitle||"").toLowerCase().includes(lq)||(i.id||"").toLowerCase().includes(lq));}f=[...f];if(sort==="date-desc")f.sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));else if(sort==="date-asc")f.sort((a,b)=>(a.updatedAt||"").localeCompare(b.updatedAt||""));else if(sort==="name")f.sort((a,b)=>(a.customerName||"").localeCompare(b.customerName||""));return f;},[list,q,sort]);
  const handleExport=async it=>{let d=it._data;if(!d){try{const full=await loadP(it.id);d=full?.data;}catch(e){alert("データ取得失敗");return;}}const blob=new Blob([JSON.stringify({id:it.id,data:d},null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=`${it.customerName||"export"}_${it.id}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);};
  const handleImport=async file=>{try{const text=await file.text();const json=JSON.parse(text);const d=json.data||json;const id=genId();const now=new Date().toISOString();d.dataType="multi";d.updatedAt=now;d.expiresAt=calcExpiry(now);await saveP(id,d);onLoad(id);}catch(e){alert("インポート失敗: "+e.message);}};
  const handleDelete=async id=>{if(!confirm("この物件を削除しますか？\n関連画像もすべて削除されます。"))return;const it=list.find(x=>x.id===id);let d=it?._data;if(!d){try{const full=await loadP(id);d=full?.data;}catch(e){}}try{await delWithImages(id,d);}catch(e){try{await delP(id);}catch(e2){}}setList(l=>l.filter(x=>x.id!==id));};
  const handleCleanup=async()=>{
    if(!confirm("使われていない画像をR2から削除します。\n全物件データを確認するため少し時間がかかります。"))return;
    try{
      const r=await api("/api/images",{auth:true});
      const allKeys=new Set(r.keys||[]);
      if(allKeys.size===0){alert("R2に画像がありません。");return;}
      const usedKeys=new Set();
      for(const it of list){
        let d=it._data;if(!d){try{const full=await loadP(it.id);d=full?.data;}catch(e){continue;}}
        extractR2Keys(d).forEach(k=>usedKeys.add(k));
      }
      const orphans=[...allKeys].filter(k=>!usedKeys.has(k));
      if(orphans.length===0){alert("孤立した画像はありません。\n（R2: "+allKeys.size+"件 / 使用中: "+usedKeys.size+"件）");return;}
      if(!confirm(orphans.length+"件の未使用画像を削除します。"))return;
      await Promise.allSettled(orphans.map(k=>api("/api/images/"+k,{method:"DELETE",auth:true})));
      alert("✓ "+orphans.length+"件の不要画像を削除しました。");
    }catch(e){alert("クリーンアップ失敗: "+e.message);}
  };
  return<div style={{width:"100%",height:"100%",background:"#FAF8F5",display:"flex",flexDirection:"column"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:"1px solid #EDEAE6",background:"#fff",flexShrink:0}}><button onClick={onBack} style={{background:"none",border:"none",fontSize:13,cursor:"pointer"}}>◀ 戻る</button><div style={{fontSize:14,fontWeight:600}}>物件一覧</div><button onClick={handleCleanup} title="不要画像を削除" style={{background:"none",border:"1px solid #E5E0DA",borderRadius:6,padding:"5px 8px",fontSize:10,color:"#A09890",cursor:"pointer"}}>🧹 R2整理</button></div>
    <div style={{padding:"12px 16px",background:"#fff",borderBottom:"1px solid #EDEAE6",flexShrink:0}}>
      <div style={{display:"flex",gap:8}}><div style={{flex:1,position:"relative"}}><input value={q} onChange={e=>setQ(e.target.value)} placeholder="検索（名前・タイトル・ID）" style={{...S.inp,paddingLeft:32,fontSize:12}}/><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A09890" strokeWidth="2" style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)"}}><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></div><select value={sort} onChange={e=>setSort(e.target.value)} style={{...S.inp,width:130,fontSize:11,padding:"8px 10px"}}><option value="date-desc">更新日↓新しい</option><option value="date-asc">更新日↑古い</option><option value="name">名前順</option></select><button onClick={()=>impRef.current?.click()} style={{...S.smB,background:"#2C2420",color:"#fff",flexShrink:0,fontSize:10,padding:"8px 12px"}}>インポート</button><input ref={impRef} type="file" accept=".json" onChange={e=>{const f=e.target.files?.[0];if(f)handleImport(f);e.target.value="";}} style={{display:"none"}}/></div></div>
    <div style={{flex:1,overflowY:"auto",padding:16,minHeight:0}}>{ld&&<div style={{textAlign:"center",padding:60,color:"#A09890"}}>読み込み中...</div>}{!ld&&filtered.length===0&&<div style={{textAlign:"center",padding:60,color:"#A09890"}}>{q?"該当なし":"データなし"}</div>}{filtered.map(it=>{const rd=remainDays(it.expiresAt);return<div key={it.id} style={{padding:14,background:"#fff",borderRadius:10,border:"1px solid #EDEAE6",marginBottom:8,display:"flex",alignItems:"center",gap:12,maxWidth:700}}><div style={{width:4,height:40,borderRadius:2,background:"#C4956A",flexShrink:0}}/><div style={{flex:1,minWidth:0}}><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:14,fontWeight:500}}>{it.customerName||"未設定"} 様</span></div><div style={{fontSize:11,color:"#A09890",marginTop:3,display:"flex",gap:10,flexWrap:"wrap"}}><span>{it.planTitle}</span><span style={{fontFamily:"monospace",fontSize:10}}>#{it.id}</span><span style={{fontSize:10,color:"#B5AFA8"}}>{fmtDate(it.updatedAt)}</span>{rd!=null&&<span style={{fontSize:9,color:rd<30?"#C44":"#A09890",fontWeight:rd<30?600:400}}>期限 {fmtDateShort(it.expiresAt)}（残{rd}日）</span>}</div></div><button onClick={()=>handleExport(it)} title="エクスポート" style={{background:"none",border:"1px solid #E5E0DA",borderRadius:6,padding:"6px 8px",cursor:"pointer",flexShrink:0}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A09890" strokeWidth="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button><button onClick={()=>onLoad(it.id)} style={{background:"#2C2420",color:"#fff",border:"none",borderRadius:6,padding:"8px 14px",fontSize:11,cursor:"pointer",flexShrink:0}}>開く</button><button onClick={()=>handleDelete(it.id)} style={{background:"none",border:"none",color:"#CCC5BE",fontSize:16,cursor:"pointer",flexShrink:0}}>✕</button></div>;})}</div></div>;}

const getTabs=(plans)=>[{id:"basic",l:"基本"},{id:"concept",l:"コンセプト"},{id:"before",l:"現況図面"},...plans.map((_,i)=>({id:`plan-${i}`,l:`プラン${i+1}`,color:plans[i]?.color||PLAN_COLORS[i%PLAN_COLORS.length]})),{id:"compare",l:"比較表"}];

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
